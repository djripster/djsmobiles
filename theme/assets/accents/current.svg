<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 108">
  <!-- Core Logo Overlay: America 250 -->

  <!-- ============================================= -->
  <!-- FIREWORK: positioned left of the shield mark   -->
  <!-- ============================================= -->
  <g transform="translate(9 20)">

    <!-- soft glow behind the burst -->
    <circle cx="0" cy="0" r="13" fill="#f5c542" opacity="0.16"/>

    <!-- long primary rays (gold) -->
    <g stroke="#f5c542" stroke-width="1.6" stroke-linecap="round" opacity="0.95">
      <line x1="0" y1="0" x2="0" y2="-14"/>
      <line x1="0" y1="0" x2="0" y2="13"/>
      <line x1="0" y1="0" x2="-8" y2="0"/>
      <line x1="0" y1="0" x2="13" y2="0"/>
    </g>

    <!-- short secondary rays (red/blue alternating) -->
    <g stroke-linecap="round">
      <line x1="0" y1="0" x2="-6" y2="-9" stroke="#B22234" stroke-width="1.4"/>
      <line x1="0" y1="0" x2="9" y2="-9" stroke="#3C3B6E" stroke-width="1.4"/>
      <line x1="0" y1="0" x2="-6" y2="9" stroke="#3C3B6E" stroke-width="1.4"/>
      <line x1="0" y1="0" x2="9" y2="9" stroke="#B22234" stroke-width="1.4"/>
    </g>

    <!-- fine in-between sparks for a denser burst -->
    <g stroke-linecap="round" opacity="0.8">
      <line x1="0" y1="0" x2="-2" y2="-16" stroke="#B22234" stroke-width="1"/>
      <line x1="0" y1="0" x2="5" y2="-16" stroke="#3C3B6E" stroke-width="1"/>
      <line x1="0" y1="0" x2="-9" y2="4" stroke="#3C3B6E" stroke-width="1"/>
      <line x1="0" y1="0" x2="-9" y2="-3" stroke="#f5c542" stroke-width="1"/>
      <line x1="0" y1="0" x2="16" y2="6" stroke="#f5c542" stroke-width="1"/>
      <line x1="0" y1="0" x2="15" y2="-6" stroke="#B22234" stroke-width="1"/>
    </g>

    <!-- sparkle dots at ray tips -->
    <g fill="#f5c542">
      <circle cx="0" cy="-14" r="1.3"/>
      <circle cx="0" cy="13" r="1.1"/>
      <circle cx="-8" cy="0" r="1.1"/>
      <circle cx="13" cy="0" r="1.1"/>
    </g>
    <g fill="#B22234">
      <circle cx="-2" cy="-16" r="0.8"/>
      <circle cx="15" cy="-6" r="0.8"/>
    </g>
    <g fill="#3C3B6E">
      <circle cx="5" cy="-16" r="0.8"/>
      <circle cx="-9" cy="4" r="0.8"/>
    </g>

    <!-- bright core -->
    <circle cx="0" cy="0" r="2.1" fill="#fff8e0"/>
    <circle cx="0" cy="0" r="1.1" fill="#f5c542"/>
  </g>

  <!-- ============================================= -->
  <!-- FLAG: positioned after the final "S"           -->
  <!-- ============================================= -->
  <g transform="translate(578 100) scale(0.62)">
    <!-- Pole -->
    <rect x="0" y="0" width="2.5" height="48" rx="1.25" fill="#1f3763"/>
    <circle cx="1.25" cy="0" r="3" fill="#1f3763"/>
    <!-- Base -->
    <path d="M-9 48 C8 45 25 45 42 48" fill="none" stroke="#1f3763" stroke-width="2" stroke-linecap="round"/>
    <!-- Flag white field -->
    <path
      d="M3 6
         C16 4 25 11 38 8
         L38 31
         C25 34 16 27 3 29
         Z"
      fill="#ffffff"/>
    <!-- Red stripes -->
    <path d="M3 7 C16 5 25 12 38 9 L38 13 C25 16 16 9 3 11 Z" fill="#B22234"/>
    <path d="M3 16 C16 14 25 21 38 18 L38 22 C25 25 16 18 3 20 Z" fill="#B22234"/>
    <path d="M3 25 C16 23 25 30 38 27 L38 31 C25 34 16 27 3 29 Z" fill="#B22234"/>
    <!-- Blue canton -->
    <path
      d="M3 6
         C10 5 15 7 20 9
         L20 20
         C15 18 10 16 3 17
         Z"
      fill="#3C3B6E"/>
    <!-- Stars -->
    <g fill="#fff">
      <circle cx="7" cy="9" r="0.8"/>
      <circle cx="12" cy="10" r="0.8"/>
      <circle cx="17" cy="11" r="0.8"/>
      <circle cx="9" cy="14" r="0.8"/>
      <circle cx="15" cy="15" r="0.8"/>
    </g>
  </g>
</svg>
