<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">

  <!-- Firework -->
  <g stroke="#f5c542" stroke-width="2" stroke-linecap="round" opacity="0.65">
    <line x1="18" y1="18" x2="18" y2="6"/>
    <line x1="18" y1="18" x2="18" y2="30"/>
    <line x1="18" y1="18" x2="6" y2="18"/>
    <line x1="18" y1="18" x2="30" y2="18"/>
    <line x1="18" y1="18" x2="10" y2="10"/>
    <line x1="18" y1="18" x2="26" y2="10"/>
    <line x1="18" y1="18" x2="10" y2="26"/>
    <line x1="18" y1="18" x2="26" y2="26"/>
  </g>

  <!-- Flag pole -->
  <rect
      x="34"
      y="12"
      width="2"
      height="40"
      rx="1"
      fill="#777"/>

  <!-- Flag -->
  <path
      d="
      M36 12
      C44 12 48 14 54 12
      L54 34
      C48 36 44 34 36 34
      Z"
      fill="#ffffff"/>

  <!-- Red stripes -->
  <rect x="36" y="14" width="18" height="2.8" fill="#B22234"/>
  <rect x="36" y="19.5" width="18" height="2.8" fill="#B22234"/>
  <rect x="36" y="25" width="18" height="2.8" fill="#B22234"/>
  <rect x="36" y="30.5" width="18" height="2.8" fill="#B22234"/>

  <!-- Blue canton -->
  <rect
      x="36"
      y="14"
      width="8"
      height="8"
      fill="#3C3B6E"/>

  <!-- Stars -->
  <g fill="#fff">
    <circle cx="38" cy="16" r="0.5"/>
    <circle cx="41" cy="16" r="0.5"/>
    <circle cx="39.5" cy="18.5" r="0.5"/>
    <circle cx="38" cy="21" r="0.5"/>
    <circle cx="41" cy="21" r="0.5"/>
  </g>

</svg>
