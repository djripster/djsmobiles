<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 108">
  <!-- Core Logo Overlay: America 250 -->

  <!-- Firework: upper-left logo area -->
  <g transform="translate(64 21) scale(0.9)"
     stroke="#f5c542"
     stroke-width="2"
     stroke-linecap="round"
     opacity="0.7">
    <line x1="18" y1="18" x2="18" y2="3"/>
    <line x1="18" y1="18" x2="18" y2="32"/>
    <line x1="18" y1="18" x2="3" y2="18"/>
    <line x1="18" y1="18" x2="32" y2="18"/>
    <line x1="18" y1="18" x2="7" y2="7"/>
    <line x1="18" y1="18" x2="29" y2="7"/>
    <line x1="18" y1="18" x2="7" y2="29"/>
    <line x1="18" y1="18" x2="29" y2="29"/>
  </g>

  <!-- Extra red/blue firework sparks -->
  <g transform="translate(64 21) scale(0.9)" stroke-linecap="round">
    <line x1="18" y1="18" x2="12" y2="0" stroke="#b22234" stroke-width="2"/>
    <line x1="18" y1="18" x2="24" y2="0" stroke="#004b93" stroke-width="2"/>
    <line x1="18" y1="18" x2="0" y2="12" stroke="#b22234" stroke-width="2"/>
    <line x1="18" y1="18" x2="36" y2="12" stroke="#004b93" stroke-width="2"/>
  </g>

  <!-- Flag group: right side of wordmark -->
  <g transform="translate(510 37) scale(1.05)">
    <!-- Pole -->
    <rect x="0" y="0" width="2.5" height="48" rx="1.25" fill="#1f3763"/>
    <circle cx="1.25" cy="0" r="3" fill="#1f3763"/>

    <!-- Base -->
    <path d="M-9 48 C8 45 25 45 42 48" fill="none" stroke="#1f3763" stroke-width="2" stroke-linecap="round"/>

    <!-- Flag white field -->
    <path
      d="M3 6
         C16 4 25 11 38 8
         L38 31
         C25 34 16 27 3 29
         Z"
      fill="#ffffff"/>

    <!-- Red stripes clipped visually to flag shape -->
    <path d="M3 7 C16 5 25 12 38 9 L38 13 C25 16 16 9 3 11 Z" fill="#B22234"/>
    <path d="M3 16 C16 14 25 21 38 18 L38 22 C25 25 16 18 3 20 Z" fill="#B22234"/>
    <path d="M3 25 C16 23 25 30 38 27 L38 31 C25 34 16 27 3 29 Z" fill="#B22234"/>

    <!-- Blue canton -->
    <path
      d="M3 6
         C10 5 15 7 20 9
         L20 20
         C15 18 10 16 3 17
         Z"
      fill="#3C3B6E"/>

    <!-- Stars -->
    <g fill="#fff">
      <circle cx="7" cy="9" r="0.8"/>
      <circle cx="12" cy="10" r="0.8"/>
      <circle cx="17" cy="11" r="0.8"/>
      <circle cx="9" cy="14" r="0.8"/>
      <circle cx="15" cy="15" r="0.8"/>
    </g>
  </g>
</svg>
